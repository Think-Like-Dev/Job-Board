[project]
name = "ai-platform"
version = "0.1.0"
description = "Async AI microservice for the Job Board ATS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.10",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# FastAPI dependencies intentionally use Depends() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
