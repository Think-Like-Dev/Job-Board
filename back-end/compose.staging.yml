name: job-board-staging
services:
  platform-api:
    image: job-board-platform-api:staging

    build:
      context: ./platform-api
      dockerfile: Dockerfile

    env_file:
      - ./env/.env.staging

    environment:
      NODE_ENV: staging

    ports:
      - "5000:5000"

    command: ["pnpm", "start:dist"]

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Migration
  migrate:
    image: job-board-platform-api:staging

    profiles:
      - migration

    env_file:
      - ./env/.env.staging

    environment:
      NODE_ENV: staging
      # The CLI forces `preferTs` on unless this is "0", which would make it
      # look for `src/**` entities that the production image does not contain.
      MIKRO_ORM_CLI_PREFER_TS: "0"

    command: ["pnpm","migration:up:dist"]

    restart: "no"

    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy

  # Seed
  seed:
    image: job-board-platform-api:staging

    profiles:
      - seed

    env_file:
      - ./env/.env.staging

    environment:
      NODE_ENV: staging
      MIKRO_ORM_CLI_PREFER_TS: "0"

    command: ["pnpm","seed:run:dist"]

    restart: "no"

    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - backend

volumes:
  postgres_data:
    name: job-board-staging-postgres-data

  redis_data:
    name: job-board-staging-redis-data
