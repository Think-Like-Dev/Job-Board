name: job-board
services:

  postgres:
    image: postgres:18-bookworm

    container_name: postgres-db
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U thinklikedev -d job_board" ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: thinklikedev
      POSTGRES_PASSWORD: admin@thinklikedev
      POSTGRES_DB: job_board
    ports:
      - "5432:5432"
    volumes:
      - job_board_postgres:/var/lib/postgresql
    networks:
      - pg-network

volumes:
  job_board_postgres:

networks:
  pg-network:
    external: true