name: job-board-backend

services:
  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile

    restart: unless-stopped

    networks:
      - backend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # S3-compatible object storage for resumes and cover letters.
  garage:
    image: dxflrs/garage:v1.3.1

    restart: unless-stopped

    command: ["/garage", "-c", "/etc/garage.toml", "server"]

    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage

    networks:
      - backend

    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "node", "id"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot initialiser: assigns the single-node layout and creates the
  # bucket/key. Safe to re-run; existing resources are left untouched.
  garage-init:
    build:
      context: ./garage
      dockerfile: Dockerfile.init

    depends_on:
      garage:
        condition: service_started

    environment:
      GARAGE_BUCKET: ${S3_BUCKET_NAME:-jobboard-files}
      GARAGE_KEY_NAME: jobboard
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}

    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      # The CLI reads the node key from the metadata directory before it can
      # talk to the running node over RPC. Read-only is enough.
      - garage_data:/var/lib/garage:ro

    # Share Garage's network namespace so the CLI can reach the node on
    # 127.0.0.1:3901.
    network_mode: "service:garage"

    restart: "no"

  # Optional file browser for the Garage bucket. Start with:
  #   docker compose --profile debug up -d garage-webui
  # UI: http://localhost:3909
  garage-webui:
    image: khairul169/garage-webui:1.1.0

    profiles:
      - debug

    restart: unless-stopped

    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro

    environment:
      API_BASE_URL: http://garage:3903
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      # Optional: username:bcrypt-hash from `htpasswd -nbBC 10 user pass`.
      AUTH_USER_PASS: ${GARAGE_WEBUI_AUTH:-}

    ports:
      - "3909:3909"

    networks:
      - backend

    depends_on:
      garage:
        condition: service_started

  # migrate
  migrate:
    build:
      context: ./platform-api
      target: migration

    profiles:
      - migration

    restart: "no"

    networks:
      - backend

  # seed
  seed:
    build:
      context: ./platform-api
      target: seed

    profiles:
      - seed

    restart: "no"

    networks:
      - backend

  # debug
  pgadmin:
    image: dpage/pgadmin4:latest

    profiles:
      - debug

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

    networks:
      - backend

  redisinsight:
    image: redis/redisinsight:latest

    profiles:
      - debug

    ports:
      - "5540:5540"

    volumes:
      - redisinsight_data:/data

    networks:
      - backend
networks:
  backend:
    name: job-board-backend
    driver: bridge
volumes:
  pgadmin_data:
    name: job-board-pgadmin-data

  redisinsight_data:
    name: job-board-redisinsight-data

  garage_data:


#host.docker.internal
