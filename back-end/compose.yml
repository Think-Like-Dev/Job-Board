name: job-board-backend

services:
  platform-api:
    build:
      context: ./platform-api
      dockerfile: Dockerfile

    restart: unless-stopped

    networks:
      - backend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # migrate
  migrate:
    build:
      context: ./platform-api
      target: migration

    profiles:
      - migration

    restart: "no"

    networks:
      - backend

  # seed
  seed:
    build:
      context: ./platform-api
      target: seed

    profiles:
      - seed

    restart: "no"

    networks:
      - backend

  # debug
  pgadmin:
    image: dpage/pgadmin4:latest

    profiles:
      - debug

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

    networks:
      - backend

  redisinsight:
    image: redis/redisinsight:latest

    profiles:
      - debug

    ports:
      - "5540:5540"

    volumes:
      - redisinsight_data:/data

    networks:
      - backend
networks:
  backend:
    name: job-board-backend
    driver: bridge
volumes:
  pgadmin_data:
    name: job-board-pgadmin-data

  redisinsight_data:
    name: job-board-redisinsight-data

#host.docker.internal
