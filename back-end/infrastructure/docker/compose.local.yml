name: job-board-local

# Local differences only. Every service, healthcheck and depends_on lives in
# compose.yml; this file adds dev images, source mounts, commands, published
# ports and per-environment volume names.

services:
  platform-api:
    image: job-board-platform-api:local

    build:
      context: ../../platform-api
      dockerfile: Dockerfile.dev

    env_file:
      - ../../env/.env.local

    environment:
      NODE_ENV: local
      # Inside Compose the API reaches Garage by service name. Host-run dev
      # servers use http://localhost:3900 from .env.local instead.
      S3_ENDPOINT: http://garage:3900
      # Same idea for the datastores: .env.local carries the host view
      # (localhost + published ports), the container gets service names.
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      # Mailpit runs in this stack; the host view uses localhost:1025.
      MAIL_HOST: mailpit

    volumes:
      - ../../platform-api:/app
      - platform_api_node_modules:/app/node_modules

    ports:
      - "5000:5000"

    command: ["pnpm", "start:dev"]

  ai-platform:
    image: job-board-ai-platform:local

    build:
      context: ../../ai-platform
      dockerfile: Dockerfile.dev

    env_file:
      - ../../env/.env.local

    environment:
      AI_ENVIRONMENT: local
      # Inside Compose the AI service reaches Garage by service name. The
      # shared env file keeps the host view (localhost:3900) for services that
      # run outside Docker.
      S3_ENDPOINT: http://garage:3900
      AI_RABBITMQ_HOST: rabbitmq
      # Same for its own database: host port 5433, container port 5432.
      AI_DATABASE_HOST: ai-postgres
      AI_DATABASE_PORT: "5432"
      # The model servers run on the host (see
      # ai-platform/scripts/start-llama-servers.ps1), so the container reaches
      # them through the Docker host gateway. The alias is the chat server's
      # `--alias`; swapping the GGUF keeps it.
      AI_LOCAL_LLM_BASE_URL: http://host.docker.internal:9931/v1
      AI_LOCAL_LLM_MODEL: local-chat
      AI_EMBEDDING_BASE_URL: http://host.docker.internal:9932/v1
      # Doubles as the cache key for stored vectors. A new name means the
      # vectors from the previous model file are not silently reused.
      AI_LOCAL_EMBEDDING_MODEL: multilingual-e5-small-xlmr
      # Keep the ONNX runtime from using every core: the whole stack shares
      # one 8 GB machine.
      OMP_NUM_THREADS: "2"

    # Docker Desktop resolves host.docker.internal to an IPv6 address, which
    # the container cannot reach; this maps it to the IPv4 gateway instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # The scoring job is the memory peak (OCR + embeddings). Capped so it
    # cannot squeeze the other services out of the machine.
    mem_limit: 1280m

    volumes:
      - ../../ai-platform:/app
      # Image venv seeded into the volume on first run, then kept out of the bind mount.
      - ai_platform_venv:/app/.venv

    ports:
      - "8000:8000"

    # --reload-dir keeps the watcher off .venv and __pycache__ under the bind mount.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]

  garage:
    ports:
      - "3900:3900"

  # Published for host-side tools (psql, DBeaver, redis-cli, RabbitMQ UI).
  # Staging publishes none of these.
  postgres:
    ports:
      - "5432:5432"

  ai-postgres:
    # 5432 is already taken by the core API's Postgres; only the host port differs.
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6379:6379"

  # Mailpit: SMTP on 1025, web inbox on http://localhost:8025.
  mailpit:
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  # Debug tools: host ports live here so local can reach them and staging cannot.
  pgadmin:
    ports:
      - "5050:80"

  redisinsight:
    ports:
      - "5540:5540"

  garage-webui:
    ports:
      - "3909:3909"

  # Migration
  migrate:
    image: job-board-platform-api:local

    profiles:
      - migration

    env_file:
      - ../../env/.env.local

    environment:
      NODE_ENV: local
      DATABASE_HOST: postgres

    volumes:
      - ../../platform-api:/app
      - platform_api_node_modules:/app/node_modules

    command: ["pnpm", "migration:up"]

    restart: "no"

    networks:
      - backend

  # Seed
  seed:
    image: job-board-platform-api:local

    profiles:
      - seed

    env_file:
      - ../../env/.env.local

    environment:
      NODE_ENV: local
      DATABASE_HOST: postgres

    volumes:
      - ../../platform-api:/app
      - platform_api_node_modules:/app/node_modules

    command: ["pnpm", "seed:run"]

    restart: "no"

    networks:
      - backend

  ai-migrate:
    image: job-board-ai-platform:local

    profiles:
      - migration

    env_file:
      - ../../env/.env.local

    environment:
      AI_ENVIRONMENT: local
      AI_DATABASE_HOST: ai-postgres
      AI_DATABASE_PORT: "5432"

    volumes:
      - ../../ai-platform:/app
      - ai_platform_venv:/app/.venv

  ai-seed:
    image: job-board-ai-platform:local

    profiles:
      - seed

    env_file:
      - ../../env/.env.local

    environment:
      AI_ENVIRONMENT: local
      AI_DATABASE_HOST: ai-postgres
      AI_DATABASE_PORT: "5432"

    volumes:
      - ../../ai-platform:/app
      - ai_platform_venv:/app/.venv

volumes:
  platform_api_node_modules:
    name: job-board-platform-api-node-modules

  postgres_data:
    name: job-board-local-postgres-data

  ai_postgres_data:
    name: job-board-local-ai-postgres-data

  rabbitmq_data:
    name: job-board-local-rabbitmq-data

  ai_platform_venv:
    name: job-board-local-ai-platform-venv

  redis_data:
    name: job-board-local-redis-data

  garage_data:
    name: job-board-local-garage-data
