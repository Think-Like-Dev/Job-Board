name: job-board-prod

services:
  platform-api:
    env_file:
      - ../../env/.env.production

    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://garage:3900

    ports:
      - "5000:5000"

  migrate:
    env_file:
      - ../../env/.env.production
    environment:
      NODE_ENV: production

  seed:
    env_file:
      - ../../env/.env.production
    environment:
      NODE_ENV: production

volumes:
  garage_data:
    name: job-board-prod-garage-data
