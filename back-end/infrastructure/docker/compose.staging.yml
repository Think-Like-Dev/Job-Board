name: job-board-staging

# Staging differences only. Every service, healthcheck and depends_on lives in
# compose.yml. No infrastructure port is published here — the APIs reach
# postgres/ai-postgres/redis/rabbitmq by service name on the compose network.

services:
  platform-api:
    image: job-board-platform-api:staging

    build:
      context: ../../platform-api
      dockerfile: Dockerfile

    env_file:
      - ../../env/.env.staging

    environment:
      NODE_ENV: staging
      S3_ENDPOINT: http://garage:3900

    ports:
      - "5000:5000"

    command: ["pnpm", "start:dist"]

    restart: unless-stopped

  ai-platform:
    image: job-board-ai-platform:staging

    build:
      context: ../../ai-platform
      dockerfile: Dockerfile

    env_file:
      - ../../env/.env.staging

    environment:
      AI_ENVIRONMENT: staging

    ports:
      - "8000:8000"

    restart: unless-stopped

  # Migration
  migrate:
    image: job-board-platform-api:staging

    profiles:
      - migration

    env_file:
      - ../../env/.env.staging

    environment:
      NODE_ENV: staging
      # The CLI forces `preferTs` on unless this is "0", which would make it
      # look for `src/**` entities that the production image does not contain.
      MIKRO_ORM_CLI_PREFER_TS: "0"

    command: ["pnpm","migration:up:dist"]

    restart: "no"

    networks:
      - backend

  # Seed
  seed:
    image: job-board-platform-api:staging

    profiles:
      - seed

    env_file:
      - ../../env/.env.staging

    environment:
      NODE_ENV: staging
      MIKRO_ORM_CLI_PREFER_TS: "0"

    command: ["pnpm","seed:run:dist"]

    restart: "no"

    networks:
      - backend

  ai-migrate:
    image: job-board-ai-platform:staging

    profiles:
      - migration

    env_file:
      - ../../env/.env.staging

    environment:
      AI_ENVIRONMENT: staging

    restart: "no"

    networks:
      - backend

  ai-seed:
    image: job-board-ai-platform:staging

    profiles:
      - seed

    env_file:
      - ../../env/.env.staging

    environment:
      AI_ENVIRONMENT: staging

    restart: "no"

    networks:
      - backend

volumes:
  postgres_data:
    name: job-board-staging-postgres-data

  ai_postgres_data:
    name: job-board-staging-ai-postgres-data

  rabbitmq_data:
    name: job-board-staging-rabbitmq-data

  redis_data:
    name: job-board-staging-redis-data

  garage_data:
    name: job-board-staging-garage-data
